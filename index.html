<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 聊天</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { text-align: center; color: #333; }

        #chat-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai   { background: #e9ecef; color: #333; }

        #input-area { display: flex; gap: 10px; }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        #send-btn {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        #send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🤖 我的 AI 助手</h1>

    <div id="chat-box"></div>

    <div id="input-area">
        <input id="user-input" placeholder="输入消息..." />
        <button id="send-btn">发送</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("user-input");
        const btn = document.getElementById("send-btn");

        function addMsg(text, cls) {
            const div = document.createElement("div");
            div.className = "msg " + cls;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;   // 自动滚到底
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, "user");
            input.value = "";

            try {
                const res = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                addMsg(data.reply, "ai");
            } catch (e) {
                addMsg("出错了：" + e.message, "ai");
            }
        }

        btn.onclick = send;
        input.addEventListener("keypress", e => {
            if (e.key === "Enter") send();
        });
    </script>
</body>
</html>
